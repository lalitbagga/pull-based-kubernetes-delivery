apiVersion: v1
kind: Pod
metadata:
  name: {{ include "delivery-api.fullname" . }}-test
  labels:
    {{- include "delivery-api.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: ready
      image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command: ["/bin/sh", "-ec"]
      args:
        - wget --quiet --output-document=- http://{{ include "delivery-api.fullname" . }}:{{ .Values.service.port }}/ready
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        runAsUser: 1000
        runAsGroup: 1000
      resources:
        requests:
          cpu: 5m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
